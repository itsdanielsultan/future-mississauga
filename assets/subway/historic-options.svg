<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc"><title id="title">Different historical subway options</title><desc id="desc">Three simplified historical diagrams: the 1993 EA via East Mall and West Mall to Dixie; the 2001 TTC D3 option from Kipling to Mississauga City Centre, screened out; and a Dundas Connects subway option to Cooksville, followed by BRT selection in 2018. Diagrams are redrawn and not geographic station plans.</desc><defs><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#d6d9cc" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#193037}.small{font-size:16px;fill:#546a70}.label{font-size:20px;font-weight:600}.title{font-size:30px;font-weight:600}.tag{font-size:13px;letter-spacing:1.8px;font-weight:700}.note{font-size:16px;fill:#52676c}.route{fill:none;stroke:#805998;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:15 12}.node{fill:#fbfbf5;stroke:#805998;stroke-width:5}</style><rect width="1280" height="700" rx="16" fill="#edf1e8"/>
<text x="44" y="49" class="tag">HISTORICAL OPTIONS · THREE DIFFERENT RECORDS</text><text x="44" y="88" class="title">There was more than one idea.</text>
<rect x="30" y="116" width="1220" height="156" rx="10" fill="#fffef8"/><text x="54" y="152" class="label">1993 EA</text><text x="54" y="179" class="small">Boundary extension</text><text x="54" y="224" class="small">As later shown by</text><text x="54" y="245" class="small">Dundas Connects</text>
<path d="M480 210H708Q760 210 793 170H1140" stroke="#637f95" stroke-width="7" fill="none"/>
<g fill="#fffef8" stroke="#637f95" stroke-width="4"><circle cx="480" cy="210" r="9"/><circle cx="708" cy="210" r="9"/><circle cx="912" cy="170" r="9"/><circle cx="1140" cy="170" r="9"/></g>
<text x="480" y="184" text-anchor="middle" class="small">Dixie</text><text x="708" y="243" text-anchor="middle" class="small">West Mall</text><text x="912" y="143" text-anchor="middle" class="small">East Mall</text><text x="1140" y="205" text-anchor="middle" class="small">Kipling</text>
<rect x="30" y="289" width="1220" height="166" rx="10" fill="#fffef8"/><text x="54" y="325" class="label">2001 RTES · D3</text><text x="54" y="352" class="small">City Centre option</text><text x="54" y="395" class="small">Screened out from</text><text x="54" y="417" class="small">further consideration</text>
<path d="M455 345L560 403H930L1140 345" stroke="#8f9091" stroke-width="7" fill="none" stroke-dasharray="9 7"/><circle cx="455" cy="345" r="9" fill="#fffef8" stroke="#8f9091" stroke-width="4"/><circle cx="1140" cy="345" r="9" fill="#fffef8" stroke="#8f9091" stroke-width="4"/>
<text x="455" y="321" text-anchor="middle" class="small">City Centre</text><text x="730" y="434" text-anchor="middle" class="small">Broadly alongside the Milton rail corridor</text><text x="1140" y="380" text-anchor="middle" class="small">Kipling</text>
<rect x="30" y="472" width="1220" height="157" rx="10" fill="#fffef8"/><text x="54" y="508" class="label">Dundas Connects</text><text x="54" y="535" class="small">Subway alternative</text><text x="54" y="578" class="small">BRT selected in the</text><text x="54" y="600" class="small">2018 Master Plan</text>
<path d="M455 519V562H1140" stroke="#5393aa" stroke-width="7" fill="none"/><circle cx="455" cy="519" r="9" fill="#fffef8" stroke="#5393aa" stroke-width="4"/><circle cx="1140" cy="562" r="9" fill="#fffef8" stroke="#5393aa" stroke-width="4"/><text x="455" y="496" text-anchor="middle" class="small">Cooksville GO</text><text x="794" y="594" text-anchor="middle" class="small">Dundas corridor</text><text x="1140" y="535" text-anchor="middle" class="small">Kipling</text>
<text x="44" y="669" class="note">Simplified historical diagrams, not approved construction plans. Sources: City panels; TTC ES-14 / ES-15; 2018 Master Plan.</text>
