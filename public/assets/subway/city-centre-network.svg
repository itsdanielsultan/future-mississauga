<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc"><title id="title">One independent City Centre subway concept</title><desc id="desc">Diagram, not a geographic alignment. An illustrative connection links Kipling, Sherway, Dixie, Cawthra, Cooksville and City Centre study areas. Intermediate dots are author-selected study areas, not approved stations. Existing GO and planned LRT and BRT connections are schematic.</desc><defs><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#d6d9cc" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#193037}.small{font-size:16px;fill:#546a70}.label{font-size:20px;font-weight:600}.title{font-size:30px;font-weight:600}.tag{font-size:13px;letter-spacing:1.8px;font-weight:700}.note{font-size:16px;fill:#52676c}.route{fill:none;stroke:#805998;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:15 12}.node{fill:#fbfbf5;stroke:#805998;stroke-width:5}</style><rect width="1280" height="650" rx="16" fill="#edf1e8"/>
<text x="44" y="52" class="tag">INDEPENDENT CONCEPT · NOT AN APPROVED ROUTE</text><text x="44" y="92" class="title">What could connect?</text><text x="1236" y="52" text-anchor="end" class="small">Schematic · not to scale</text>
